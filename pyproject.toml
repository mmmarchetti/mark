[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_mini_brain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "openai",
    "faster-whisper",
    "piper-tts",
    "reachy-mini-dances-library",
    "silero-vad",
    "torch",
    "torchaudio",
    "requests",
    "pillow",
    "soundfile",
    "ddgs",
    "feedparser",
    "python-dotenv",
    # Identity (face + voice recognition) - Phase E
    "insightface",
    "resemblyzer",
    "scikit-learn",
    # Custom neural wake-word (opt-in) - Phase F
    "openwakeword",
    "joblib",
]
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
reachy_mini_brain = "reachy_mini_brain.main:ReachyMiniBrain"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_mini_brain = ["**/*"] # Also include all non-.py files